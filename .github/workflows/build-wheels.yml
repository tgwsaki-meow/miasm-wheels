name: Build Miasm Wheels (Linux x86_64)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      miasm_ref:
        description: 'Miasm Git ref / branch / tag to build'
        required: true
        default: 'master'

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels on Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Miasm upstream
        uses: actions/checkout@v4
        with:
          repository: cea-sec/miasm
          ref: ${{ github.event.inputs.miasm_ref || 'master' }}
          path: miasm-upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: miasm-upstream
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
          CIBW_SKIP: "pp* *musllinux*"
          CIBW_BEFORE_BUILD: "pip install 'setuptools>=77' wheel"
          CIBW_TEST_REQUIRES: "future pyparsing==3.3.2"
          CIBW_TEST_COMMAND: "python -c \"import miasm; print('Miasm imported successfully!')\""

      - name: Download dependency wheels (future & pyparsing)
        run: |
          python -m pip install --upgrade pip
          pip download future "pyparsing==3.3.2" -d wheelhouse/

      - name: List built wheels
        run: ls -la wheelhouse/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miasm-linux-x86_64-wheels
          path: wheelhouse/*.whl

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.5-linux-x86_64 wheelhouse/*.whl \
            --title "Miasm 0.1.5 Linux x86_64 Prebuilt Wheels" \
            --notes "Precompiled manylinux x86_64 binary wheels for Miasm 0.1.5 (Python 3.10, 3.11, 3.12, 3.13) along with dependency wheels (future, pyparsing)." \
            --clobber || gh release upload v0.1.5-linux-x86_64 wheelhouse/*.whl --clobber
