name: Build Miasm Wheels (Windows x86_64)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      miasm_ref:
        description: 'Miasm Git ref / branch / tag to build'
        required: true
        default: 'master'

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows x86_64 (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.13', '3.12', '3.11', '3.10']

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout Miasm upstream
        uses: actions/checkout@v4
        with:
          repository: cea-sec/miasm
          ref: ${{ github.event.inputs.miasm_ref || 'master' }}
          path: miasm-upstream

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure LLVM / Clang for Miasm
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin") {
              "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $llvmDir = "C:\Program Files\LLVM"
          } else {
              $clangCmd = Get-Command clang.exe -ErrorAction SilentlyContinue
              if ($clangCmd) {
                  $llvmDir = Split-Path (Split-Path $clangCmd.Source -Parent) -Parent
              } else {
                  $llvmDir = "C:\Program Files\LLVM"
              }
          }
          Write-Host "Configuring LLVM directory: $llvmDir"
          New-Item -Path "HKLM:\SOFTWARE\LLVM" -Force -ErrorAction SilentlyContinue
          New-Item -Path "HKLM:\SOFTWARE\LLVM\LLVM" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\LLVM\LLVM" -Name "(Default)" -Value $llvmDir -Force

          & clang.exe --version
          & clang-cl.exe --version
          & cl.exe 2>&1 | Select-Object -First 1

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools

      - name: Build Miasm Windows Wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path wheelhouse -Force
          cd miasm-upstream
          $env:MIASM_REQUIRE_JIT = "1"
          python -m pip wheel . --no-deps -w ../wheelhouse/
          cd ..

      - name: Download dependency wheels (future & pyparsing)
        shell: pwsh
        run: |
          python -m pip download future "pyparsing==3.3.2" -d wheelhouse/

      - name: List built wheels
        shell: pwsh
        run: |
          Get-ChildItem -Path wheelhouse\*.whl | Select-Object Name, Length

      - name: Test Wheel Installation
        shell: pwsh
        run: |
          $futureWhl = (Get-Item wheelhouse\future-*.whl).FullName
          $pyparsingWhl = (Get-Item wheelhouse\pyparsing-*.whl).FullName
          $miasmWhl = (Get-Item wheelhouse\miasm-*.whl).FullName
          python -m pip install $futureWhl $pyparsingWhl $miasmWhl
          python -c "import miasm; from miasm.analysis.machine import Machine; m = Machine('x86_64'); print('Miasm Machine initialized successfully:', m)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: miasm-windows-py${{ matrix.python-version }}
          path: wheelhouse/*.whl

  release_windows:
    name: Publish Windows Release
    needs: build_windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download all built wheels
        uses: actions/download-artifact@v4
        with:
          path: all_windows_wheels
          merge-multiple: true

      - name: List collected wheels
        shell: pwsh
        run: |
          Get-ChildItem -Path all_windows_wheels\*.whl | Select-Object Name, Length

      - name: Create or Update GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $wheels = (Get-ChildItem -Path all_windows_wheels\*.whl).FullName
          gh release create v0.1.5-windows-amd64 $wheels `
            --title "Miasm 0.1.5 Windows x86_64 (win_amd64) Prebuilt Wheels" `
            --notes "Precompiled Windows 11 / x86_64 binary wheels for Miasm 0.1.5 (CPython 3.10 - 3.14) with JIT native extensions." || `
          gh release upload v0.1.5-windows-amd64 $wheels --clobber
